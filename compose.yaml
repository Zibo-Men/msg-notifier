services:
  msg-notifier:
    build: .
    image: msg-notifier:local
    container_name: msg-notifier
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # noVNC：浏览器打开 http://192.168.0.119:8101/vnc.html 手动登录各平台
      - "${NOVNC_PORT:-8101}:6080"
    volumes:
      # Chromium 持久化 profile（登录态、cookies），务必保留
      - ./data:/data
    shm_size: "1gb"
    mem_limit: 3g
    healthcheck:
      # main.py 每轮循环都会 touch /tmp/heartbeat，3 分钟没更新视为卡死
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -3 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
